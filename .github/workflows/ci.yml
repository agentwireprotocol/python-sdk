name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - name: Install the package and the test tools
        run: python -m pip install -e ".[dev]"
      - name: Build awp, for the tunnel and the conformance suite
        run: go install github.com/agentwireprotocol/awp/cmd/awp@1bd8112984bf9a323034d2fc031e019c1bbbac4a
      - name: Tests, including the conformance suite
        run: AWP_BIN="$(go env GOPATH)/bin/awp" python -m pytest -v
      - name: Tests with the pure-Python Ed25519
        run: AWP_BIN="$(go env GOPATH)/bin/awp" AWP_PURE_ED25519=1 python -m pytest -q -k "conversation or pure_python"
